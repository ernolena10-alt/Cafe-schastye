<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кафе Счастье</title>
<script src="https://unpkg.com/@vkontakte/vk-bridge/dist/browser.min.js"></script>
</head>
<body style="font-family:Arial;padding:20px;text-align:center">

<h1 id="hello">Добро пожаловать!</h1>
<p>Рады видеть вас в кафе «Счастье» ☕️</p>

<script>
if (window.vkBridge) {
  vkBridge.send('VKWebAppInit')
    .then(() => vkBridge.send('VKWebAppGetUserInfo'))
    .then(user => {
      document.getElementById('hello').innerText =
        'Добрый день, ' + user.first_name + '!';
    })
    .catch(() => {
      document.getElementById('hello').innerText =
        'Добро пожаловать!';
    });
}
</script>

</body>
</html>
